name: Bug report
description: Report a reproducible Acceptora Agent Skill defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Remove credentials, private source, personal data, customer data, and production payloads. Use SECURITY.md for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version and installed commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, Git, operating system, and client versions
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Affected operation
      options:
        - Install or update
        - Status or uninstall
        - Project preflight or instructions
        - MCP or REST
        - Release bundle
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed all credentials and private data, and this is not a vulnerability report.
          required: true
