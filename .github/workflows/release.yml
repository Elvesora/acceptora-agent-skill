name: production-main-validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-main-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production main
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out production source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Prepare owner-only Python runtime
        uses: ./.github/actions/prepare-python

      - name: Require production main
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Run package tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: '"$SAFE_PYTHON" -m unittest discover -s tests -p "test_*.py"'

      - name: Build the production-main ZIP bundle
        run: '"$SAFE_PYTHON" -B -I scripts/build_release.py --dist-dir "$RUNNER_TEMP/acceptora-agent-skill-dist" --source-commit "$GITHUB_SHA"'

      - name: Verify the bundle contract and checksums
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/acceptora-agent-skill-dist/release-manifest.json"
          jq -e \
            --arg commit "$GITHUB_SHA" \
            '.distribution.repository_url == "https://github.com/Elvesora/acceptora-agent-skill"
              and .distribution.branch == "main"
              and .source_state == "clean"
              and .source_commit == $commit
              and .embedded_provenance.filename == "acceptora-agent-skill-provenance.json"
              and ([.artifacts[] | select(.format == "zip")] | length == 1)' \
            "$manifest"
          (
            cd "$RUNNER_TEMP/acceptora-agent-skill-dist"
            sha256sum --check SHA256SUMS
            unzip -t "$(jq -er '.artifacts[] | select(.format == "zip") | .filename' release-manifest.json)"
          )

      - name: Check patch whitespace
        run: git diff --check
